name: Test

on:
  workflow_dispatch:
  push:
    branches: "**"

permissions:
  contents: write

jobs:
  test:
    name: Test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: "Darwin only: Brew packages"
        if: matrix.os == 'macos-latest'
        run: |
          brew install tree

      - name: Install dependencies
        run: bun install

      - name: Bundle & Compile
        run: bun run build

      - name: Test
        run: bun test